# Puerto de la aplicación
server.port=8080

# Nombre de la aplicación
spring.application.name=mi-app-java

# Encoding UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Azure SQL Server (usuario y contraseña salen de las variables de entorno USER y PASSWORD)
azure.sql.server=sql-terraformcloud-dev-westeurope-002.database.windows.net
azure.sql.database=sqldb-terraformcloud-dev-westeurope-002

